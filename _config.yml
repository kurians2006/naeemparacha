about_content: | # this will include new lines to allow paragraphs
  Lead iOS Engineer and Mobile Engineering Leader with **16+ years** of experience architecting, developing and delivering enterprise-grade native iOS applications across Banking, Government, Media and Enterprise domains.

  Expert in <mark>Swift</mark>, <mark>SwiftUI</mark>, <mark>UIKit</mark>, <mark>Objective-C</mark>, <mark>MVVM</mark>, <mark>Clean Architecture</mark>, <mark>CI/CD</mark>, <mark>GraphQL</mark> and mobile architecture. Successfully led cross-functional engineering teams, modernized legacy applications, delivered high-performance mobile platforms and managed complete App Store release lifecycles.

  AI-Assisted Software Engineer experienced in leveraging <mark>ChatGPT</mark>, <mark>GitHub Copilot</mark>, <mark>Claude</mark>, <mark>Gemini</mark> and <mark>Cursor AI</mark> for code generation, debugging, architecture reviews, documentation, unit testing, refactoring and developer productivity while maintaining engineering best practices.

  <a class="resume-download" href="#download-resume" role="button">Download Resume</a>

